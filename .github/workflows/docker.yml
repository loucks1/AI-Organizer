name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t ai-organizer:ci .

      - name: Serve and curl
        run: |
          set -euo pipefail
          docker run -d --name ai-organizer-ci -p 8765:8765 -v ai-organizer-ci:/data ai-organizer:ci
          trap 'docker rm -f ai-organizer-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:8765/healthz
          echo
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          python3 - <<'PY'
          import json, urllib.request
          locs = json.load(urllib.request.urlopen("http://127.0.0.1:8765/locations"))
          paths = {row["path"] for row in locs}
          assert paths == {
              "Garage",
              "Garage / Parts cabinet",
              "Garage / Parts cabinet / Drawer 3",
          }, locs
          assert len(locs) == 3
          PY

      - name: Exercise write endpoints
        run: |
          set -euo pipefail
          docker run -d --name ai-organizer-ci2 -p 8765:8765 -v ai-organizer-ci2:/data ai-organizer:ci
          trap 'docker rm -f ai-organizer-ci2 >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          base=http://127.0.0.1:8765
          curl -fsS -X POST "$base/locations" -d '{"name":"Smoke"}' > /tmp/loc.json
          python3 - <<'PY'
          import json
          loc = json.load(open("/tmp/loc.json"))
          assert loc["path"] == "Smoke", loc
          open("/tmp/loc_id", "w").write(str(loc["id"]))
          PY
          printf 'smoke' > /tmp/smoke.jpg
          curl -fsS -F "photo=@/tmp/smoke.jpg" -F "location_id=$(cat /tmp/loc_id)" \
            "$base/upload" > /tmp/up.json
          python3 - <<'PY'
          import json
          up = json.load(open("/tmp/up.json"))
          assert up["status"] == "pending" and up["location"] == "Smoke", up
          open("/tmp/photo_id", "w").write(str(up["photo_id"]))
          PY
          curl -fsS -X POST "$base/photos/$(cat /tmp/photo_id)/categorization" \
            -d '{"items":[{"name":"smoke widget","bbox":[0,0,0.5,0.5],"confidence":0.5}]}' \
            > /tmp/cat.json
          python3 - <<'PY'
          import json
          cat = json.load(open("/tmp/cat.json"))
          assert cat["filed"] == 1 and cat["status"] == "categorized", cat
          PY
          curl -fsS -F "photo=@/tmp/smoke.jpg" -F "location_path=Smoke / Drawer" \
            "$base/upload" > /tmp/up2.json
          python3 - <<'PY'
          import json
          up = json.load(open("/tmp/up2.json"))
          assert up["location"] == "Smoke / Drawer" and up["status"] == "pending", up
          PY
          curl -fsS -X POST "$base/locations" -d '{"name":"Smoke2"}' > /tmp/loc2.json
          python3 - <<'PY'
          import json
          loc2 = json.load(open("/tmp/loc2.json"))
          open("/tmp/loc2_id", "w").write(str(loc2["id"]))
          PY
          curl -fsS -X POST "$base/locations/$(cat /tmp/loc2_id)/merge" \
            -d "{\"into_id\": $(cat /tmp/loc_id)}" > /tmp/merge.json
          python3 - <<'PY'
          import json
          m = json.load(open("/tmp/merge.json"))
          assert m["merged"] == "Smoke2" and m["into"] == "Smoke", m
          PY
          python3 - <<'PY'
          import json
          up = json.load(open("/tmp/up.json"))
          open("/tmp/photo_file", "w").write(up["filename"])
          up2 = json.load(open("/tmp/up2.json"))
          open("/tmp/photo2_id", "w").write(str(up2["photo_id"]))
          PY
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "$base/locations/$(cat /tmp/loc_id)")
          test "$code" = 409
          curl -fsS -X DELETE "$base/photos/$(cat /tmp/photo_id)" > /tmp/del.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/del.json"))
          assert d["items_deleted"] == 1 and d["file_removed"] is True, d
          PY
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$base/photo/$(cat /tmp/photo_file)")
          test "$code" = 404
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "$base/photos/$(cat /tmp/photo_id)")
          test "$code" = 404
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "$base/items/999999")
          test "$code" = 404
          curl -fsS -X DELETE "$base/photos/$(cat /tmp/photo2_id)" > /tmp/del2.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/del2.json"))
          assert d["items_deleted"] == 0, d
          PY
          curl -fsS "$base/locations" > /tmp/locs.json
          python3 - <<'PY'
          import json
          locs = json.load(open("/tmp/locs.json"))
          child = next(r for r in locs if r["path"] == "Smoke / Drawer")
          open("/tmp/child_id", "w").write(str(child["id"]))
          PY
          curl -fsS -X DELETE "$base/locations/$(cat /tmp/child_id)" > /tmp/del3.json
          curl -fsS -X DELETE "$base/locations/$(cat /tmp/loc_id)" > /tmp/del4.json
          python3 - <<'PY'
          import json
          d3 = json.load(open("/tmp/del3.json"))
          d4 = json.load(open("/tmp/del4.json"))
          assert d3["path"] == "Smoke / Drawer", d3
          assert d4["path"] == "Smoke", d4
          PY
